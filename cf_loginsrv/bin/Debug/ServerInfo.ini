[ServerInfo]
; DEBUG local test config. ServerServiceForceIP=127.0.0.1 avoids the PrivateIPRule lookup.
ServerServiceForceIP		= 127.0.0.1
; MGMT listens on this port, LOGIN listens on this port + 1 (ServerConfig.cs:10/12).
; The client must be pointed at 13006.
ServerServiceForcePort		= 13005
ServerMaxUser			= 10000
ServerMaxBufferSize		= 1024
ServerDefaultAllocSize		= 50000
ClientVersion			= 1001
LimitTime			= 30
ReLimitTime			= 10
SSN				= 318
TestServer			= 1
; DB aliases are unused in DEBUG when GDBGW is absent, but must exist to avoid warnings.
GameDB				= CF_SA_GAME
LogDB				= CF_SA_LOG
GuildDB				= CF_SA_GUILD
EventDB				= CF_SA_EVENT

[LogInfo]
; 5 = DEBUG: needed to see the per-packet lines and the CONNECT_RESULT byte probe.
ServerLogLevel	= 5
ServerLogPath	= C:\Log

[BridgeServerExist]
; NO => PMS/MMS connections are skipped entirely.
ValidCheck	= NO
MMSValidCheck	= NO
PMSConn		= NO

[LauncherLoginServiceMgmt]
; NO => use the normal (password) login path instead of the Launcher key path.
UseLLSMgmt	= NO
LLSMgmtIP	= 127.0.0.1
LLSMgmtPort	= 7998

[MM_SERVER_FUNCTION]
Enable			= 0
AutoServerSelect	= 0
